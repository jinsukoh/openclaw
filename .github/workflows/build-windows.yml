name: Build Windows Application

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: |
          npm install -g pnpm
          pnpm install

      - name: Build Core
        run: pnpm build

      - name: Build UI
        run: pnpm ui:build

      - name: Prepare Windows Build
        # Copy built artifacts to apps/windows so Electron Builder includes them reliably
        run: |
          mkdir apps\windows\backend
          xcopy /E /I dist apps\windows\backend\dist
        shell: cmd

      - name: Build Windows Installer
        run: pnpm --filter openclaw-windows build

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-Windows-Installer
          path: apps/windows/dist-installer/*.exe
